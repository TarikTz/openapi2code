version: 2

project_name: openapi2code

before:
  hooks:
    - go mod tidy

builds:
  - id: openapi2code
    main: ./cmd/openapi2code
    binary: openapi2code
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Deliberately excludes {{ .Version }}: the website links straight to
    # https://github.com/.../releases/latest/download/<name>, which only
    # stays stable across releases if the asset name itself never changes.
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: TarikTz
    name: openapi2code
