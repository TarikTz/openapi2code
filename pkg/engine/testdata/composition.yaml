openapi: "3.0.3"
info:
  title: Composition fixture
  version: "1.0.0"
components:
  schemas:
    Animal:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    Dog:
      allOf:
        - $ref: "#/components/schemas/Animal"
        - type: object
          properties:
            breed:
              type: string
          required:
            - breed
    StringOrNumber:
      oneOf:
        - type: string
        - type: number
    Pet:
      anyOf:
        - $ref: "#/components/schemas/Dog"
        - $ref: "#/components/schemas/Animal"
